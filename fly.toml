# Fly.io app configuration for the Paytag backend API.
# After installing flyctl and running `flyctl auth login`, deploy with:
#   flyctl deploy
#
# Replace `primary_region` with the Fly region closest to your Supabase project.
# Full region list: https://fly.io/docs/reference/regions/

app = "paytag-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
