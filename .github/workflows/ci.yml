name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The jobs only read the repository; nothing pushes, comments or deploys from CI.
permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main (every merge) always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the comment is the release it was at); .github/dependabot.yml
# bumps both together. A tag can be moved to other code; a SHA can't.

jobs:
  backend-sdk:
    name: Backend + SDK
    runs-on: ubuntu-latest
    # A hung step (a stuck install, a runaway fuzz run) would otherwise hold a runner for 6h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The token is only needed to fetch; don't leave it on disk for npm install scripts.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Pinned with the Contracts job: the ABI check builds the contracts.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5

      - name: Install workspaces
        run: npm ci

      # The ABI is frozen at v0.2.0-contracts; fail if src/onchain/generated or
      # web/lib/onchain/generated no longer match the contracts and src/onchain.
      - name: Check generated on-chain files
        run: (cd contracts && forge build) && npm run abis:check

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Test backend
        run: npm test

      - name: Test SDK
        run: npm run sdk:test

      - name: Build SDK
        run: npm run sdk:build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    # A hung step (a stuck install, a runaway fuzz run) would otherwise hold a runner for 6h.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      # Job-wide so no step can rewrite snapshots/GasTest.json: the snapshotGas cheatcodes in
      # test/Gas.t.sol compare against the committed file instead of overwriting it.
      FORGE_SNAPSHOT_CHECK: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The token is only needed to fetch; don't leave it on disk for npm install scripts.
          persist-credentials: false

      # Pinned: formatter and gas output can change between releases. Bump deliberately.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Unit tests only: fuzz/invariant gas varies run to run.
      - name: Check gas snapshots
        run: forge snapshot --check --no-match-test "testFuzz|invariant"

  web:
    name: Web
    runs-on: ubuntu-latest
    # A hung step (a stuck install, a runaway fuzz run) would otherwise hold a runner for 6h.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build SDK (web depends on it)
        run: npm run sdk:build

      - name: Type-check web
        run: npm run -w paytag-web type-check

      # lib/onchain: tx state machine, revert decoding, and the shared codec vectors
      # (reads tests/onchain/vectors.json, which this checkout includes).
      - name: Test web
        run: npm run -w paytag-web test

      - name: Build web
        run: npm run web:build
