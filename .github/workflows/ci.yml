name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-sdk:
    name: Backend + SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Test backend
        run: npm test

      - name: Test SDK
        run: npm run sdk:test

      - name: Build SDK
        run: npm run sdk:build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      # Job-wide so no step can rewrite snapshots/GasTest.json: the snapshotGas cheatcodes in
      # test/Gas.t.sol compare against the committed file instead of overwriting it.
      FORGE_SNAPSHOT_CHECK: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned: formatter and gas output can change between releases. Bump deliberately.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Unit tests only: fuzz/invariant gas varies run to run.
      - name: Check gas snapshots
        run: forge snapshot --check --no-match-test "testFuzz|invariant"

  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Standalone package (not an npm workspace): Ponder 0.18 needs Node >= 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install
        run: npm ci

      # The ABI is frozen at v0.1.0-contracts; fail if abis/ no longer matches the contracts.
      - name: Check ABIs match contracts
        run: (cd ../contracts && forge build) && npm run abis:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build SDK (web depends on it)
        run: npm run sdk:build

      - name: Type-check web
        run: npm run -w paytag-web type-check

      - name: Build web
        run: npm run web:build
