name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-sdk:
    name: Backend + SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Test backend
        run: npm test

      - name: Test SDK
        run: npm run sdk:test

      - name: Build SDK
        run: npm run sdk:build

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build SDK (web depends on it)
        run: npm run sdk:build

      - name: Type-check web
        run: npm run -w paytag-web type-check

      - name: Build web
        run: npm run web:build
