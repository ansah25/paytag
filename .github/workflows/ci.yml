name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-sdk:
    name: Backend + SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Test backend
        run: npm test

      - name: Test SDK
        run: npm run sdk:test

      - name: Build SDK
        run: npm run sdk:build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned: formatter and gas output can change between releases. Bump deliberately.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Unit tests only: fuzz/invariant gas varies run to run. FORGE_SNAPSHOT_CHECK makes the
      # snapshotGas cheatcodes in test/Gas.t.sol compare against snapshots/GasTest.json.
      - name: Check gas snapshots
        env:
          FORGE_SNAPSHOT_CHECK: true
        run: forge snapshot --check --no-match-test "testFuzz|invariant"

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Build SDK (web depends on it)
        run: npm run sdk:build

      - name: Type-check web
        run: npm run -w paytag-web type-check

      - name: Build web
        run: npm run web:build
